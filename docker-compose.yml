version: '3.8'

services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lob-kg-dev-app
    ports:
      - "8501:8501"
    volumes:
      # Mount artifacts directory for persistent data storage
      - ./artifacts:/app/artifacts
      # Optionally mount .env file if you want to manage it separately
      # - ./.env:/app/.env:ro
    environment:
      # Load environment variables from .env file
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

